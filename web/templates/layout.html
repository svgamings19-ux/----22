{{define "layout"}}<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{.Title}} · Учёт трат</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body><a class="skip" href="#main">К содержимому</a>
<header class="header"><div class="shell topbar"><a class="brand" href="/expenses"><span class="brand-icon" aria-hidden="true">₽</span> Учёт трат</a><nav aria-label="Основная навигация">{{if .User.ID}}<a href="/expenses">Мои траты</a><a href="/stats">Статистика</a><a href="/expenses/export">Экспорт CSV</a>{{end}}<a href="/about">О приложении</a></nav><div class="account">{{if .User.ID}}<span class="email">{{.User.Email}}</span><form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><button class="button subtle" type="submit">Выйти</button></form>{{else}}<a href="/login">Войти</a><a class="button small" href="/register">Регистрация</a>{{end}}</div></div></header>
<main id="main" class="shell main">{{template "content" .}}</main>
<footer class="shell footer"><span>Учёт личных трат</span><span>Ваши расходы. Понятная картина.</span></footer></body></html>{{end}}
