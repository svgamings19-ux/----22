{{define "content"}}<div class="form-page"><a class="back" href="/expenses">← К списку трат</a><h1>{{.Title}}</h1><p class="muted">Сохраните детали — они помогут понять ваши расходы.</p><form class="card stack" method="post" action="{{.Action}}"><input type="hidden" name="csrf_token" value="{{.CSRF}}">{{if .Error}}<p class="alert" role="alert">{{.Error}}</p>{{end}}
<label>Сумма, ₽<input name="amount" value="{{.Amount}}" inputmode="decimal" placeholder="0,00" required maxlength="12" aria-describedby="amount-error">{{with index .Errors "amount"}}<span class="field-error" id="amount-error">{{.}}</span>{{end}}</label>
<label>Описание<input name="description" value="{{.Description}}" placeholder="Например, продукты на неделю" required maxlength="200" aria-describedby="description-error">{{with index .Errors "description"}}<span class="field-error" id="description-error">{{.}}</span>{{end}}</label>
<div class="form-grid"><label>Дата<input type="date" name="date" value="{{.Date}}" required min="0001-01-01" max="9999-12-31" aria-describedby="date-error">{{with index .Errors "date"}}<span class="field-error" id="date-error">{{.}}</span>{{end}}</label><label>Категория<select name="category_id" required aria-describedby="category-error"><option value="">Выберите категорию</option>{{range .Categories}}<option value="{{.ID}}" {{if eq $.CategoryID .ID}}selected{{end}}>{{.Name}}</option>{{end}}</select>{{with index .Errors "category"}}<span class="field-error" id="category-error">{{.}}</span>{{end}}</label></div>
<div class="form-actions"><button class="button" type="submit">Сохранить трату</button><a href="/expenses">Отмена</a></div></form></div>{{end}}
