{{define "content"}}<div class="form-page"><a class="back" href="/expenses">← К списку трат</a><section class="card stack"><p class="eyebrow">ПОДТВЕРЖДЕНИЕ</p><h1>Удалить трату?</h1><p>Запись будет удалена без возможности восстановления.</p><dl class="details"><dt>Описание</dt><dd>{{.Expense.Description}}</dd><dt>Сумма</dt><dd>{{money .Expense.Amount}} ₽</dd><dt>Дата</dt><dd>{{date .Expense.Date}}</dd><dt>Категория</dt><dd>{{.Expense.Category}}</dd></dl><form method="post" action="{{.Action}}"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><div class="form-actions"><button class="button danger" type="submit">Удалить</button><a href="/expenses">Оставить запись</a></div></form></section></div>{{end}}
